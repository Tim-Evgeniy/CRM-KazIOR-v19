# Replace the hostname and TLS paths. Add this hostname to allowed_hosts in config.local.json.
# Keep Python bound to 127.0.0.1:8000 when using this proxy.
server {
    listen 443 ssl;
    server_name crm.onco.local;
    ssl_certificate /etc/nginx/ssl/crm.crt;
    ssl_certificate_key /etc/nginx/ssl/crm.key;
    client_max_body_size 15m;
    location / {
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-Proto https;
        proxy_read_timeout 60s;
    }
}
